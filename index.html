<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7fb" />
    <meta
      name="description"
      content="JZQ-Talker：口语背诵、对话回答和论文汇报英文表达学习台"
    />
    <title>JZQ-Talker</title>
    <link rel="stylesheet" href="./styles.css?v=20260912-pastel-v2" />
  </head>
  <body data-theme="pink">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">JZQ</div>
        <div>
          <p class="eyebrow">English Study Desk</p>
          <h1>JZQ-Talker</h1>
          <p id="statusLine">正在读取学习数据</p>
        </div>
      </div>

      <div class="top-actions">
        <div
          class="theme-switcher"
          role="radiogroup"
          aria-label="选择页面主题"
        >
          <button
            class="theme-option active"
            type="button"
            role="radio"
            aria-checked="true"
            data-theme-option="pink"
            title="粉白主题"
          >
            <span class="theme-swatch pink-swatch" aria-hidden="true"></span>
            <span>粉白</span>
          </button>
          <button
            class="theme-option"
            type="button"
            role="radio"
            aria-checked="false"
            data-theme-option="light"
            title="淡蓝主题"
          >
            <span class="theme-swatch light-swatch" aria-hidden="true"></span>
            <span>淡蓝</span>
          </button>
          <button
            class="theme-option"
            type="button"
            role="radio"
            aria-checked="false"
            data-theme-option="eye"
            title="护眼主题"
          >
            <span class="theme-swatch eye-swatch" aria-hidden="true"></span>
            <span>护眼</span>
          </button>
        </div>

        <div class="voice-bar" aria-label="英文朗读设置">
          <label class="field compact">
            <span>Voice</span>
            <select id="voiceSelect"></select>
          </label>
          <label class="field rate-field">
            <span>Rate <strong id="rateValue">0.92</strong></span>
            <input
              id="rateControl"
              type="range"
              min="0.7"
              max="1.15"
              step="0.01"
              value="0.92"
            />
          </label>
          <button id="stopSpeechBtn" class="icon-button" type="button" title="停止朗读">
            Stop
          </button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="summary-band" aria-label="学习统计">
        <div>
          <p class="eyebrow">Today</p>
          <h2 id="viewTitle">口语背诵</h2>
        </div>
        <div class="metrics">
          <div class="metric">
            <span id="sentenceCount">0</span>
            <small>口语句子</small>
          </div>
          <div class="metric">
            <span id="dialogueCount">0</span>
            <small>情景对话</small>
          </div>
          <div class="metric">
            <span id="paperCount">0</span>
            <small>论文表达</small>
          </div>
          <div class="metric">
            <span id="savedCount">0</span>
            <small>已记住</small>
          </div>
        </div>
      </section>

      <nav class="tabs" aria-label="学习内容">
        <button class="tab active" type="button" data-view="oral">口语背诵</button>
        <button class="tab" type="button" data-view="dialogue">对话回答</button>
        <button class="tab" type="button" data-view="papers">论文表达</button>
      </nav>

      <section class="controls" aria-label="筛选">
        <label class="field search-field">
          <span>Search</span>
          <input
            id="searchInput"
            type="search"
            placeholder="输入英文、中文、论文题目或方法名"
          />
        </label>
        <label class="field" data-control="oral">
          <span>Category</span>
          <select id="categorySelect"></select>
        </label>
        <label class="field" data-control="dialogue">
          <span>Dialogue</span>
          <select id="dialogueSelect"></select>
        </label>
        <label class="field" data-control="papers">
          <span>Paper</span>
          <select id="paperSelect"></select>
        </label>
        <button id="shuffleBtn" class="primary-action" type="button">Random</button>
      </section>

      <section id="oralView" class="workspace" aria-label="口语背诵">
        <div class="section-head">
          <div>
            <p class="eyebrow">Daily English</p>
            <h2>基础句子</h2>
          </div>
          <button id="loadMoreBtn" class="secondary-action" type="button">
            More
          </button>
        </div>
        <div id="sentenceGrid" class="card-grid"></div>
      </section>

      <section id="dialogueView" class="workspace hidden" aria-label="对话回答">
        <div class="dialogue-layout">
          <article class="practice-panel">
            <div class="section-head">
              <div>
                <p class="eyebrow">Dialogue Practice</p>
                <h2 id="dialogueTitle">对话练习</h2>
              </div>
              <button id="speakPromptBtn" class="secondary-action" type="button">
                Play
              </button>
            </div>
            <div id="promptBox" class="prompt-box"></div>
            <textarea
              id="replyInput"
              rows="4"
              placeholder="输入你的英文回答"
            ></textarea>
            <div class="button-row">
              <button id="checkReplyBtn" class="primary-action" type="button">
                Check
              </button>
              <button id="hintReplyBtn" class="secondary-action" type="button">
                Hint
              </button>
              <button id="revealReplyBtn" class="primary-action" type="button">
                Reveal
              </button>
              <button id="nextTurnBtn" class="secondary-action" type="button">
                Next
              </button>
              <button id="speakMineBtn" class="secondary-action" type="button">
                Speak Mine
              </button>
              <button id="speakDialogueBtn" class="secondary-action" type="button">
                Speak All
              </button>
            </div>
            <div id="feedbackBox" class="feedback-box" aria-live="polite"></div>
            <div id="answerBox" class="answer-box"></div>
          </article>

          <article class="transcript-panel">
            <div class="section-head">
              <div>
                <p class="eyebrow">Transcript</p>
                <h2>完整对话</h2>
              </div>
            </div>
            <div id="dialogueTranscript" class="transcript"></div>
          </article>
        </div>
      </section>

      <section id="paperView" class="workspace hidden" aria-label="论文表达">
        <div class="paper-layout">
          <aside class="paper-list-panel">
            <div class="section-head">
              <div>
                <p class="eyebrow">Papers</p>
                <h2>论文列表</h2>
              </div>
            </div>
            <div id="paperList" class="paper-list"></div>
          </aside>

          <article class="paper-detail">
            <div id="paperDetail"></div>
          </article>
        </div>
      </section>
    </main>

    <template id="sentenceCardTemplate">
      <article class="study-card">
        <div class="card-topline">
          <span class="tag"></span>
          <button class="speak mini-button" type="button">Listen</button>
        </div>
        <p class="english"></p>
        <p class="chinese"></p>
        <button class="remember secondary-action" type="button">Remember</button>
      </article>
    </template>

    <script src="./data.bundle.js?v=20260912-pastel-v2"></script>
    <script src="./app.js?v=20260912-pastel-v2"></script>
  </body>
</html>
